name: refresh-snapshot
on:
  workflow_dispatch:
  schedule:
    - cron: "40 12 * * 1-5"   # 18:10 IST on trading days, after EOD data settles
  push:
    paths: ["pipeline/**", "finn/**", ".github/workflows/snapshot.yml"]
permissions:
  contents: write
concurrency: { group: snapshot, cancel-in-progress: true }
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: pipeline/requirements.txt }
      - run: pip install -q -r pipeline/requirements.txt
      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: mkdir -p data && bash pipeline/run.sh 2>&1 | tee data/last_run.log
      - name: Commit data
        if: always()
        run: |
          git config user.name "finn-bot"
          git config user.email "finn-bot@users.noreply.github.com"
          git add -A data public/data
          git commit -q -m "data: refresh snapshot" || echo "nothing to commit"
          git pull --rebase -q && git push -q
