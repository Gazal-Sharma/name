name: probe-data-sources
on:
  workflow_dispatch:
  push:
    paths: ["pipeline/probe.py", ".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q requests yfinance beautifulsoup4 pymupdf
      - run: python pipeline/probe.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Commit results
        if: always()
        run: |
          git config user.name "finn-bot"
          git config user.email "finn-bot@users.noreply.github.com"
          git add -A probe_out
          git commit -m "probe: data source results" || echo "nothing to commit"
          git pull --rebase -q && git push
